<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="0.5" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1050" cy="120" r="220" fill="#7c3aed" opacity="0.10"/>
  <circle cx="150" cy="560" r="200" fill="#06b6d4" opacity="0.10"/>

  <g transform="translate(90, 110)">
    <rect width="84" height="84" rx="22" fill="url(#brand)"/>
    <circle cx="42" cy="42" r="24" fill="none" stroke="#fff" stroke-width="7"/>
    <circle cx="42" cy="42" r="8" fill="#fff"/>
    <text x="108" y="56" font-family="Inter, Arial, sans-serif" font-size="40" font-weight="700" fill="#0b1020">Kora <tspan fill="#5b6478" font-weight="600">Software</tspan></text>
  </g>

  <text x="90" y="320" font-family="Inter, Arial, sans-serif" font-size="64" font-weight="800" fill="#0b1020">Agentes de IA para tu</text>
  <text x="90" y="398" font-family="Inter, Arial, sans-serif" font-size="64" font-weight="800" fill="url(#brand)">atención por WhatsApp</text>

  <text x="90" y="470" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="500" fill="#5b6478">Responde clientes, gestiona citas y reduce tareas</text>
  <text x="90" y="510" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="500" fill="#5b6478">administrativas con agentes inteligentes 24/7.</text>
</svg>
